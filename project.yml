name: Iman
options:
  bundleIdPrefix: com.elhassan
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGNING_ALLOWED: NO
    ENABLE_BITCODE: NO
targets:
  Iman:
    type: application
    platform: iOS
    sources:
      - path: Iman
        excludes: [Resources]
      - path: Iman/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.elhassan.iman.companion
        PRODUCT_NAME: Iman
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "2"
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Iman
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSMicrophoneUsageDescription: Iman listens when you tap the microphone or enable foreground hands-free mode. Hands-free requests beginning with Hi Iman go to your Mac after a pause.
        NSSpeechRecognitionUsageDescription: Iman uses offline English speech recognition to turn your voice into text.
        NSCameraUsageDescription: Scan the private connection code displayed by Iman on your Mac.
        NSLocalNetworkUsageDescription: Send your commands directly to Iman on your Mac over your private Wi-Fi.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
schemes:
  Iman:
    build:
      targets:
        Iman: all
