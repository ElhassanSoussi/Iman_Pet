name: Build Iman for AltStore
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Iman/**"
      - "project.yml"
      - "scripts/**"
      - "Tests/**"
      - ".github/workflows/ios-build.yml"
permissions:
  contents: read
concurrency:
  group: iman-ios-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install project generator on cloud Mac
        run: brew install xcodegen
      - name: Test voice review lifecycle
        run: bash scripts/test-voice.sh
      - name: Build unsigned iPhone app
        run: bash scripts/build-unsigned.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Iman-for-AltStore
          path: |
            build/Iman-unsigned.ipa
            build/Iman-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 3
